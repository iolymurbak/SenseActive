<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sense Active — Academia Inteligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #080808;
            --bg-card: #111111;
            --bg-card-alt: #161616;
            --bg-secondary: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted: #555555;
            --text-dim: #333333;
            --green: #00e5a0;
            --green-dim: rgba(0, 229, 160, 0.12);
            --blue: #00c4ff;
            --border-color: #1f1f1f;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --font-sans: 'DM Sans', sans-serif;
            --font-condensed: 'Barlow Condensed', sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--font-condensed);
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        button {
            font-family: var(--font-condensed);
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 99px;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--green) var(--bg-primary);
        }

        #app {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            background: var(--bg-primary);
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #appHeader {
            flex-shrink: 0;
        }

        #mainContent {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .page-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0 16px 100px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .page-content::-webkit-scrollbar {
            width: 3px;
        }

        .page-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .page-content::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 99px;
        }

        .bottom-nav {
            flex-shrink: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            display: flex;
            padding: 6px 0 14px;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 0;
            color: var(--text-dim);
            transition: color 0.2s;
            background: none;
            border: none;
            font-size: 9px;
            font-family: var(--font-condensed);
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        .nav-item .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        .nav-item .nav-icon svg {
            width: 22px;
            height: 22px;
            color: currentColor;
        }

        .nav-item.active {
            color: var(--green);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }

        .section-label {
            font-size: 10px;
            font-family: var(--font-condensed);
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--green);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .week-strip {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .week-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .week-day .day-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .week-day .day-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--text-muted);
            background: transparent;
            transition: all 0.2s;
        }

        .week-day .day-number.today {
            background: var(--green);
            color: var(--bg-primary);
            font-weight: 700;
        }

        .week-day .day-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: transparent;
            transition: background 0.2s;
        }

        .week-day .day-dot.has-checkin {
            background: var(--green);
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-card-alt);
            border-radius: var(--radius-xs);
            margin-bottom: 8px;
        }

        .exercise-item .info .name {
            font-family: var(--font-condensed);
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            letter-spacing: 0.04em;
            margin-bottom: 2px;
        }

        .exercise-item .info .details {
            color: var(--text-muted);
            font-size: 12px;
        }

        .exercise-item .weight {
            color: var(--green);
            font-family: var(--font-condensed);
            font-weight: 700;
            font-size: 14px;
            min-width: 48px;
            text-align: right;
        }

        .exercise-item .weight .unit {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .stat-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-box {
            background: var(--bg-card-alt);
            border-radius: var(--radius-sm);
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .stat-box:hover {
            background: var(--bg-secondary);
            border-color: var(--green-dim);
        }

        .stat-box .label {
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }

        .stat-box .value {
            font-family: var(--font-condensed);
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
        }

        .progress-track {
            background: var(--bg-secondary);
            border-radius: 99px;
            height: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--blue));
            border-radius: 99px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .progress-label .pct {
            color: var(--green);
            font-family: var(--font-condensed);
            font-weight: 700;
        }

        .badge-green {
            background: var(--green-dim);
            color: var(--green);
            padding: 3px 10px;
            border-radius: var(--radius-xs);
            font-size: 10px;
            font-family: var(--font-condensed);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .badge-active {
            background: rgba(0, 229, 160, 0.15);
            color: var(--green);
            padding: 3px 10px;
            border-radius: var(--radius-xs);
            font-size: 10px;
            font-family: var(--font-condensed);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-cell {
            padding: 6px 0;
            border-radius: var(--radius-xs);
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-family: var(--font-sans);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: default;
        }

        .calendar-cell .cell-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: transparent;
        }

        .calendar-cell.has-checkin {
            cursor: pointer;
        }

        .calendar-cell.has-checkin .cell-dot {
            background: var(--green);
        }

        .calendar-cell.today {
            background: var(--green-dim);
            color: var(--green);
            font-weight: 600;
        }

        .calendar-cell.selected {
            background: var(--green);
            color: var(--bg-primary);
            font-weight: 700;
        }

        .calendar-cell.selected .cell-dot {
            background: var(--bg-primary);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-nav-btn {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xs);
            padding: 6px 14px;
            color: var(--text-secondary);
            font-family: var(--font-condensed);
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
        }

        .calendar-nav-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .workout-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .workout-list-item:hover {
            border-color: rgba(0, 229, 160, 0.2);
        }

        .workout-list-item .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .workout-list-item .badge-letter {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, rgba(0, 229, 160, 0.15), rgba(0, 196, 255, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-condensed);
            font-weight: 800;
            font-size: 18px;
            color: var(--green);
        }

        .workout-list-item .info .name {
            font-family: var(--font-condensed);
            font-weight: 700;
            font-size: 17px;
            color: var(--text-primary);
        }

        .workout-list-item .info .desc {
            color: var(--text-muted);
            font-size: 13px;
        }

        .workout-list-item .info .count {
            color: var(--text-dim);
            font-size: 12px;
        }

        .workout-list-item .action {
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            background: var(--green-dim);
            border: 1px solid rgba(0, 229, 160, 0.2);
            color: var(--green);
            font-size: 11px;
            font-family: var(--font-condensed);
            font-weight: 700;
            letter-spacing: 0.06em;
            transition: background 0.2s;
        }

        .workout-list-item .action:hover {
            background: rgba(0, 229, 160, 0.2);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card-alt);
            border: none;
            border-radius: var(--radius-xs);
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 13px;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: var(--bg-secondary);
        }

        .reward-card {
            background: linear-gradient(135deg, #0d1f1a, var(--bg-card));
            border: 1px solid rgba(0, 229, 160, 0.25);
            border-radius: var(--radius);
            padding: 20px 16px;
            text-align: center;
        }

        .reward-card .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }

        .reward-card .title {
            font-family: var(--font-condensed);
            font-weight: 800;
            font-size: 20px;
            color: var(--green);
            letter-spacing: 0.1em;
        }

        .reward-card .sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .reward-card .reward-box {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 14px;
        }

        .reward-card .reward-box .reward-icon {
            font-size: 30px;
        }

        .reward-card .reward-box .reward-name {
            font-family: var(--font-condensed);
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .reward-card .reward-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .reward-card .reward-footer .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
        }

        .benefit-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .benefit-item .check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--green-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .benefit-item .check svg {
            width: 10px;
            height: 10px;
            stroke: var(--green);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--bg-secondary);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .info-row .value {
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-slide {
            animation: fadeSlide 0.3s ease;
        }

        @media (max-width: 400px) {
            .stat-grid-3 {
                gap: 6px;
            }

            .stat-box .value {
                font-size: 15px;
            }
        }

        @media (min-width: 431px) {
            #app {
                border-left: 1px solid var(--border-color);
                border-right: 1px solid var(--border-color);
                box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            width: 90%;
            max-width: 340px;
        }

        .modal-content h3 {
            font-family: var(--font-condensed);
            font-size: 20px;
            margin-bottom: 4px;
        }

        .modal-content p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .modal-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-input-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-condensed);
            font-weight: 600;
            letter-spacing: 0.06em;
        }

        .modal-input-group input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xs);
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: var(--font-sans);
            width: 100%;
        }

        .modal-input-group input:focus {
            outline: none;
            border-color: var(--green);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 8px 20px;
            border-radius: var(--radius-xs);
            font-family: var(--font-condensed);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.06em;
            transition: all 0.2s;
        }

        .modal-actions .cancel {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }

        .modal-actions .cancel:hover {
            background: var(--bg-card-alt);
        }

        .modal-actions .confirm {
            background: var(--green);
            color: var(--bg-primary);
        }

        .modal-actions .confirm:hover {
            opacity: 0.8;
        }

        .workout-detail-content .exercise-card {
            margin-bottom: 10px;
        }

        .workout-detail-content .exercise-card .set-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .workout-detail-content .exercise-card .set-group label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .workout-detail-content .exercise-card .set-group input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: var(--font-condensed);
            font-weight: 600;
            font-size: 13px;
            width: 50px;
            text-align: center;
            padding: 3px;
        }

        .workout-detail-content .exercise-card .set-group input:focus {
            outline: none;
            border-color: var(--green);
        }

        .tab-buttons {
            display: flex;
            margin: 16px 0 20px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 4px;
        }

        .tab-buttons button {
            flex: 1;
            background: none;
            border: none;
            border-radius: 8px;
            padding: 9px 0;
            color: var(--text-muted);
            font-size: 12px;
            font-family: var(--font-condensed);
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .tab-buttons button.active {
            background: var(--green);
            color: var(--bg-primary);
        }

        .save-toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            max-width: 400px;
            width: 90%;
            background: var(--green-dim);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-family: var(--font-condensed);
            font-weight: 600;
            font-size: 14px;
            animation: fadeSlide 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-bottom: 4px;
        }

        .user-greeting h1 {
            font-size: 28px;
            margin: 0;
        }

        .user-greeting p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 2px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green), var(--blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-condensed);
            font-weight: 800;
            font-size: 16px;
            color: var(--bg-primary);
            flex-shrink: 0;
        }

        .edit-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: var(--bg-card-alt);
            border-radius: var(--radius-sm);
            border: 1px dashed var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-hint:hover {
            border-color: var(--green);
            background: var(--green-dim);
        }

        .edit-hint .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }

        .edit-hint span {
            color: var(--green);
            font-size: 13px;
            font-family: var(--font-condensed);
            font-weight: 600;
        }

        .profile-avatar-container {
            padding-top: 12px;
            text-align: center;
        }

        .profile-avatar {
            width: 80px;

                    const data = JSON.parse(session);

                    return data;

            function formatDateKey(year, month, day) {
                return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            }

            function getWeekDays() {
                const today = new Date();
                const dayOfWeek = today.getDay();
                const startOfWeek = new Date(today);
                startOfWeek.setDate(today.getDate() - dayOfWeek);
                return Array.from({ length: 7 }, (_, i) => {
                    const d = new Date(startOfWeek);
                    d.setDate(startOfWeek.getDate() + i);
                    return d;
                });
            }

            function renderLineChart(data, label, color = "#00e5a0") {
                const W = 280,
                    H = 90,
                    pad = 24;
                const vals = data.map((d) => d.value);
                const min = Math.min(...vals) - 1;
                const max = Math.max(...vals) + 1;
                const xStep = (W - pad * 2) / (data.length - 1);
                const yScale = (v) => H - pad / 2 - ((v - min) / (max - min)) * (H - pad);
                const pts = data.map((d, i) => ({ x: pad + i * xStep, y: yScale(d.value) }));
                const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
                const areaD = `${pathD} L${pts[pts.length - 1].x},${H} L${pts[0].x},${H} Z`;

                const labels = data.map((d, i) =>
                    `<text x="${pad + i * xStep}" y="${H + 2}" text-anchor="middle" font-size="9" fill="#555" font-family="DM Sans">${d.label}</text>`
                ).join("");

                return `
                    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible;max-width:100%;">
                        <defs>
                            <linearGradient id="grad-${label}" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="${color}" stop-opacity="0.25" />
                                <stop offset="100%" stop-color="${color}" stop-opacity="0" />
                            </linearGradient>
                        </defs>
                        <path d="${areaD}" fill="url(#grad-${label})" />
                        <path d="${pathD}" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                        ${pts.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}" stroke="#111" stroke-width="1.5" />`).join("")}
                        ${labels}
                    </svg>
                `;
            }

            function renderProgress(value, total) {
                const pct = Math.min(100, Math.round((value / total) * 100));
                return `
                    <div class="progress-track">
                        <div class="progress-fill" style="width:${pct}%"></div>
                    </div>
                    <div class="progress-label">
                        <span>${value} / ${total}</span>
                        <span class="pct">${pct}%</span>
                    </div>
                `;
            }

            function showToast(message) {
                const existing = document.querySelector('.save-toast');
                if (existing) existing.remove();
                const div = document.createElement('div');
                div.className = 'save-toast';
                div.textContent = '✅ ' + message;
                document.body.appendChild(div);
                setTimeout(() => {
                    if (div.parentNode) div.remove();
                }, 3000);

            // ─── MODALS ───────────────────────────────────────────────────────

            window.showEditWeightModal = function () {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';

                overlay.innerHTML = `

                        <h3>Editar Peso</h3>

                        <div class="modal-actions">
                            <button class="cancel" onclick="document.getElementById('weightModal').remove()">Cancelar</button>
                            <button class="confirm" id="confirmWeight">Salvar</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                document.getElementById('confirmWeight').addEventListener('click', function () {
                    const input = document.getElementById('weightInput');
                    const newWeight = parseFloat(input.value);
                    if (newWeight > 0) {
                        MOCK_USER.weight = newWeight;
                        MOCK_USER.imc = Math.round((newWeight / (MOCK_USER.height * MOCK_USER.height)) * 10) / 10;
                        saveUserData(MOCK_USER);
                        document.getElementById('weightModal').remove();
                        if (currentTab === 'home') renderHome();
                        else if (currentTab === 'profile') renderProfile();
                        showToast('Peso atualizado com sucesso!');
                    }
                });

                document.getElementById('weightInput').addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        document.getElementById('confirmWeight').click();
                    }
                });

                setTimeout(() => {
                    const input = document.getElementById('weightInput');
                    if (input) input.focus();
                }, 100);
            }

            function renderCalendar() {
                const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro",
                    "Outubro", "Novembro", "Dezembro"
                ];
                const dayLabels = ["D", "S", "T", "Q", "Q", "S", "S"];

                const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
                const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
                const today = new Date();

                const cells = Array.from({ length: firstDay + daysInMonth }, (_, i) =>
                    i < firstDay ? null : i - firstDay + 1
                );

                const gridHtml = cells.map((day, i) => {
                    if (!day) return `<div></div>`;
                    const dateKey = formatDateKey(calendarYear, calendarMonth, day);
                    const hasCheckin = !!MOCK_CHECKINS[dateKey];
                    const isToday = calendarYear === today.getFullYear() &&
                        calendarMonth === today.getMonth() &&
                        day === today.getDate();
                    const isSelected = selectedCheckinDate === dateKey;
                    return `
                        <button class="calendar-cell ${hasCheckin ? "has-checkin" : ""} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}"
                                onclick="${hasCheckin ? `window.selectCheckin('${dateKey}')` : ''}"
                                ${!hasCheckin ? 'style="cursor:default;"' : ''}>
                            ${day}
                            <div class="cell-dot"></div>
                        </button>
                    `;
                }).join("");

                const selectedInfo = selectedCheckinDate ? MOCK_CHECKINS[selectedCheckinDate] : null;

                render(`
                    <div class="page-content">
                        <div style="padding-top:12px;margin-bottom:20px;">
                            <h1 style="font-size:28px;margin:0;">Calendário</h1>
                        </div>

                        <div class="card">
                            <div class="calendar-header">
                                <button class="calendar-nav-btn" onclick="window.changeMonth(-1)">◀</button>
                                <p style="font-family:var(--font-condensed);font-weight:700;font-size:18px;color:var(--text-primary);margin:0;letter-spacing:0.08em;">
                                    ${monthNames[calendarMonth].toUpperCase()} ${calendarYear}
                                </p>
                                <button class="calendar-nav-btn" onclick="window.changeMonth(1)">▶</button>
                            </div>
                            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;margin-bottom:6px;">
                                ${dayLabels.map(d => `<div style="text-align:center;font-size:11px;color:var(--text-muted);padding-bottom:6px;font-weight:600;">${d}</div>`).join("")}
                            </div>
                            <div class="calendar-grid">${gridHtml}</div>
                        </div>

                        ${selectedInfo ? `
                            <div class="card fade-slide">
                                <div class="section-label">Check-in Realizado</div>
                                <div class="stat-grid-2">
                                    <div class="stat-box">
                                        <div class="label">Horário</div>
                                        <div class="value">${selectedInfo.hora}</div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="label">Treino</div>
                                        <div class="value">${selectedInfo.treino}</div>
                                    </div>
                                </div>
                            </div>
                        ` : `
                            <div style="text-align:center;padding:16px 0;">
                                <p style="color:var(--text-dim);font-size:13px;">Toque em um dia destacado para ver o check-in</p>
                            </div>
                        `}
                    </div>
                `);
            }

            window.changeMonth = function (delta) {
                const newMonth = calendarMonth + delta;
                if (newMonth < 0 || newMonth > 11) return;
                calendarMonth = newMonth;
                renderCalendar();
            }

            window.selectCheckin = function (dateKey) {
                selectedCheckinDate = selectedCheckinDate === dateKey ? null : dateKey;
                renderCalendar();
            }

            function renderWorkouts() {
                if (selectedWorkoutId) {
                    const workout = MOCK_WORKOUTS.find(w => w.id === selectedWorkoutId);
                    if (workout) {
                        renderWorkoutDetail(workout);
                        return;
                    }
                }

                const listHtml = MOCK_WORKOUTS.map((w) => `
                    <div class="workout-list-item" onclick="window.showWorkoutDetail('${w.id}')">
                        <div class="left">
                            <div class="badge-letter">${w.id}</div>
                            <div class="info">
                                <div class="name">${w.nome}</div>
                                <div class="desc">${w.descricao}</div>
                                <div class="count">${w.exercicios.length} exercícios</div>
                            </div>
                        </div>
                        <button class="action" onclick="event.stopPropagation();window.showWorkoutDetail('${w.id}')">VER</button>
                    </div>
                `).join("");

                render(`
                    <div class="page-content">
                        <div style="padding-top:12px;margin-bottom:20px;">
                            <h1 style="font-size:28px;margin:0;">Meus Treinos</h1>
                            <p style="color:var(--text-muted);font-size:13px;margin-top:2px;">${MOCK_WORKOUTS.length} planos ativos</p>
                        </div>
                        ${listHtml}
                    </div>
                `);
            }

            window.showWorkoutDetail = function (id) {
                selectedWorkoutId = id;
                renderWorkouts();
            }

            window.goBackToWorkouts = function () {
                selectedWorkoutId = null;
                renderWorkouts();
            }

            window.saveWorkoutWeights = function () {
                const inputs = document.querySelectorAll('.set-weight-input');
                const saved = [];
                inputs.forEach(inp => {
                    const val = parseFloat(inp.value);
                    if (!isNaN(val) && val >= 0) {
                        saved.push({
                            exercise: inp.dataset.exercise,
                            set: inp.dataset.set,
                            weight: val
                        });
                    }
                });
                if (saved.length > 0) {
                    showToast(`${saved.length} cargas salvas com sucesso!`);
                    console.log('Cargas salvas:', saved);
                } else {
                    alert('Nenhuma carga foi registrada.');
                }
            }

            function renderWorkoutDetail(workout) {
                const exercisesHtml = workout.exercicios.map((ex, idx) => `
                    <div class="card exercise-card">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                            <div style="flex:1;">
                                <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                                    <span style="font-family:var(--font-condensed);font-weight:700;font-size:16px;color:var(--text-primary);letter-spacing:0.04em;">${ex.nome}</span>
                                    ${ex.maquina ? `<span style="display:flex;align-items:center;gap:4px;background:var(--green-dim);border-radius:6px;padding:2px 7px;color:var(--green);font-size:10px;font-family:var(--font-condensed);font-weight:700;">🤖 SMART</span>` : ""}
                                </div>
                                <p style="color:var(--text-muted);font-size:12px;margin:0 0 4px;">${ex.series} séries × ${ex.repeticoes} repetições</p>
                                ${ex.obs ? `<p style="color:var(--text-dim);font-size:11px;margin:0;">${ex.obs}</p>` : ""}
                                ${ex.maquina ? `<p style="color:var(--green);font-size:11px;margin:4px 0 0;">Carga configurada automaticamente</p>` : ""}
                            </div>
                            <div style="text-align:right;">
                                <p style="font-family:var(--font-condensed);font-weight:700;font-size:18px;color:${ex.carga > 0 ? "var(--green)" : "var(--text-muted)"};margin:0;">${ex.carga > 0 ? ex.carga : "—"}</p>
                                ${ex.carga > 0 ? `<p style="color:var(--text-muted);font-size:10px;margin:0;">kg</p>` : ""}
                            </div>
                        </div>
                        ${!ex.maquina ? `
                            <div class="set-group">
                                <label>Carga por série (kg):</label>
                                ${Array.from({ length: Math.min(ex.series, 4) }, (_, s) => `
                                    <input type="number" class="set-weight-input" data-exercise="${idx}" data-set="${s}" placeholder="${ex.carga || 0}" step="0.5" min="0" style="width:45px;" />
                                `).join("")}
                                ${ex.series > 4 ? `<span style="color:var(--text-muted);font-size:11px;">+${ex.series - 4}</span>` : ""}
                            </div>
                        ` : ""}
                    </div>
                `).join("");

                render(`
                    <div class="page-content workout-detail-content">
                        <div style="display:flex;align-items:center;gap:12px;padding-top:12px;margin-bottom:20px;">
                            <button class="back-btn" onclick="window.goBackToWorkouts()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                Voltar
                            </button>
                            <div>
                                <h1 style="font-size:24px;margin:0;">${workout.nome}</h1>
                                <p style="color:var(--text-muted);font-size:13px;margin:0;">${workout.descricao}</p>
                            </div>
                        </div>
                        ${exercisesHtml}

                        <div style="text-align:center;padding:12px 0 8px;color:var(--text-dim);font-size:12px;">
                         Preencha os campos de carga para registrar seu progresso
                        </div>

                        <button onclick="window.saveWorkoutWeights()" style="width:100%;background:var(--green);border-radius:var(--radius-sm);padding:14px;color:var(--bg-primary);font-family:var(--font-condensed);font-weight:700;font-size:16px;letter-spacing:0.08em;">
                            SALVAR PROGRESSO
                        </button>
                    </div>
                `);
            }

            // ─── PERFIL ─────────────────────────────────────────────────────

            function renderProfile() {
                const isPerfil = selectedProfileTab === "perfil";
                const isMetas = selectedProfileTab === "metas";
                const isRecompensas = selectedProfileTab === "recompensas";

                const completedGoal = MOCK_GOALS.find((g) => g.status === "concluida");

                const tabsHtml = `
                    <div class="tab-buttons">
                        <button class="${selectedProfileTab === 'perfil' ? 'active' : ''}" onclick="window.changeProfileTab('perfil')">
                            Perfil
                        </button>
                        <button class="${selectedProfileTab === 'metas' ? 'active' : ''}" onclick="window.changeProfileTab('metas')">
                            Metas
                        </button>
                        <button class="${selectedProfileTab === 'recompensas' ? 'active' : ''}" onclick="window.changeProfileTab('recompensas')">
                            Recompensas
                        </button>
                    </div>
                `;

                let contentHtml = "";
                if (isPerfil) {
                    contentHtml = `
                        <div class="stat-grid-3" style="margin-bottom:12px;">
                            ${[
                            { label: "Peso", value: `${MOCK_USER.weight} kg`, click: "showEditWeightModal()" },
                            { label: "Altura", value: `${MOCK_USER.height} m`, click: "showEditHeightModal()" },
                            { label: "IMC", value: `${MOCK_USER.imc}` },
                        ].map(s => `
                                <div class="stat-box" ${s.click ? `onclick="${s.click}"` : ""}>
                                    <div class="label">${s.label}</div>
                                    <div class="value">${s.value}</div>
                                </div>
                            `).join("")}
                        </div>
                        <div class="edit-hint" onclick="showEditWeightModal()">
                            <div class="dot"></div>
                            <span>Toque nos valores para editar seu peso ou altura</span>
                        </div>

                        <div class="card" style="margin-bottom:12px;">
                            <div class="section-label">Informações</div>
                            ${[
                            { label: "Nome completo", value: MOCK_USER.name },
                            { label: "E-mail", value: MOCK_USER.email },
                            { label: "Data de nascimento", value: MOCK_USER.birthDate },
                        ].map((row, i) => `
                                <div class="info-row" style="border-bottom:${i < 2 ? "1px solid var(--bg-secondary)" : "none"};">
                                    <span class="label">${row.label}</span>
                                    <span class="value">${row.value}</span>
                                </div>
                            `).join("")}
                        </div>

                        <div class="card" style="background:linear-gradient(135deg, var(--bg-card) 60%, #0d1f1a);">
                            <div class="section-label">Meu Plano</div>
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
                                <div>
                                    <h3 style="font-size:22px;margin:0 0 4px;">Plano ${MOCK_USER.plan}</h3>
                                    <p style="color:var(--text-muted);font-size:12px;margin:0;">Validade: ${MOCK_USER.planExpiry}</p>
                                </div>
                                <span class="badge-active">${MOCK_USER.statusPlano}</span>
                            </div>
                            <div class="benefit-list">
                                ${["Acesso à academia", "Máquinas inteligentes", "Acompanhamento de evolução", "Sistema de recompensas"].map(b => `
                                    <div class="benefit-item">
                                        <div class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                                        ${b}
                                    </div>
                                `).join("")}
                            </div>
                        </div>
                    `;
                }

                if (isMetas) {
                    contentHtml = `
                        <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">Metas definidas pelo seu personal</p>
                        ${MOCK_GOALS.map(goal => `
                            <div class="card" style="opacity:${goal.status === "concluida" ? 0.7 : 1};">
                                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
                                    <div style="flex:1;">
                                        <p style="font-family:var(--font-condensed);font-weight:700;font-size:17px;color:var(--text-primary);margin:0 0 3px;">${goal.nome}</p>
                                        <p style="color:var(--text-muted);font-size:12px;margin:0;">${goal.descricao}</p>
                                    </div>
                                    ${goal.status === "concluida" ? `<span style="font-size:18px;">🏆</span>` : ""}
                                </div>
                                ${renderProgress(goal.progresso, goal.objetivo)}
                                ${goal.recompensa ? `
                                    <div style="margin-top:10px;padding:8px 10px;background:var(--bg-card-alt);border-radius:var(--radius-xs);display:flex;align-items:center;gap:8px;">
                                        <span style="font-size:16px;">${goal.recompensa.icone}</span>
                                        <span style="color:var(--text-muted);font-size:12px;">Recompensa: <span style="color:var(--text-secondary);">${goal.recompensa.nome}</span></span>
                                    </div>
                                ` : ""}
                            </div>
                        `).join("")}
                    `;
                }

                if (isRecompensas) {
                    contentHtml = `
                        ${completedGoal ? `
                            <div class="reward-card" style="margin-bottom:16px;">
                                <span class="icon">🏆</span>
                                <div class="title">META CONCLUÍDA</div>
                                <div class="sub">Parabéns! Você atingiu sua meta.</div>
                                <div class="reward-box">
                                    <div class="reward-icon">${completedGoal.recompensa?.icone}</div>
                                    <div class="reward-name">${completedGoal.recompensa?.nome}</div>
                                </div>
                                <div class="reward-footer">
                                    <span class="dot"></span>
                                    Disponível para retirada na recepção
                                </div>
                            </div>
                        ` : `
                            <div class="empty-state">
                                <span class="icon">🎯</span>
                                <p class="title">Nenhuma recompensa disponível</p>
                                <p class="sub">Complete suas metas para desbloquear recompensas!</p>
                            </div>
                        `}

                        ${MOCK_GOALS.filter(g => g.status !== "concluida").map(goal => `
                            <div class="card" style="opacity:0.6;">
                                <div style="display:flex;align-items:center;gap:12px;">
                                    <span style="font-size:24px;">${goal.recompensa?.icone}</span>
                                    <div style="flex:1;">
                                        <p style="font-family:var(--font-condensed);font-weight:700;font-size:15px;color:var(--text-primary);margin:0 0 2px;">${goal.recompensa?.nome}</p>
                                        <p style="color:var(--text-muted);font-size:12px;margin:0 0 6px;">${goal.nome}</p>
                                        ${renderProgress(goal.progresso, goal.objetivo)}
                                    </div>
                                </div>
                            </div>
                        `).join("")}
                    `;
                }

                render(`
                    <div class="page-content">
                        <div class="profile-avatar-container">
                            <div class="profile-avatar">${MOCK_USER.avatar}</div>
                            <h1 class="profile-name">${MOCK_USER.name}</h1>
                            <p class="profile-email">${MOCK_USER.email}</p>
                        </div>

                        ${tabsHtml}

                        <div style="padding:0 0 20px;">
                            ${contentHtml}
                        </div>
                    </div>
                `);
            }

            // ─── NAVEGACAO DO PERFIL ──────────────────────────────────────

            window.changeProfileTab = function (tab) {
                selectedProfileTab = tab;
                renderProfile();
            }

            // ─── NAVIGATION ──────────────────────────────────────────────────

            window.navigateTo = function (tab) {
                currentTab = tab;
                setActiveNav(tab);
                switch (tab) {
                    case "home":
                        renderHome();
                        break;
                    case "calendar":
                        renderCalendar();
                        break;
                    case "workouts":
                        selectedWorkoutId = null;
                        renderWorkouts();
                        break;
                    case "profile":
                        selectedProfileTab = "perfil";
                        renderProfile();
                        break;
                }
            }

            // ─── LOGOUT ──────────────────────────────────────────────────────

            function handleLogout() {
                sessionStorage.removeItem("senseactive_user");
                window.location.href = '../public/cliente.html';
            }

            // ─── EVENTOS ─────────────────────────────────────────────────────

            document.querySelectorAll(".nav-item").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const tab = btn.dataset.tab;
                    if (tab) window.navigateTo(tab);
                });
            });

            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", handleLogout);
            }

            // ─── EXPOSER ──────────────────────────────────────────────────

            window.renderProfile = renderProfile;
            window.renderHome = renderHome;
            window.renderCalendar = renderCalendar;
            window.renderWorkouts = renderWorkouts;
            window.showEditWeightModal = showEditWeightModal;
            window.showEditHeightModal = showEditHeightModal;

            // ─── INIT ────────────────────────────────────────────────────────

            window.navigateTo("home");

            console.log('✅ Sense Active App iniciado com sucesso!');
            console.log('👤 Usuário:', userData.email);

            // Previne qualquer redirecionamento automático
            window.addEventListener('beforeunload', function (e) {
                // Não faz nada, apenas previne comportamentos indesejados
            });

        })();
    </script>
</body>

</html>
